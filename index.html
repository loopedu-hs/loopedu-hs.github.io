<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="백엔드 개발을 공부하는 교육생의 프로페셔널 웹사이트">
    <title>교육생 | 백엔드 개발</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="홈으로 이동">교육생</a>
      <nav aria-label="주요 메뉴">
        <a href="#about">소개</a>
        <a href="#learning">배움</a>
        <a href="#games">Games</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">BACKEND DEVELOPMENT</p>
        <h1 id="hero-title">배우고, 만들고,<br>다음 단계로.</h1>
        <p class="hero-copy">교육생으로서 이론을 실습으로 연결하며<br>단단한 웹 경험을 만들어가고 있습니다.</p>
      </section>

      <section id="about" class="content-section" aria-labelledby="about-title">
        <p class="eyebrow">ABOUT</p>
        <h2 id="about-title">안녕하세요.</h2>
        <p>백엔드 개발을 공부하는 교육생입니다. 확인된 경험과 배움만 차분하게 기록합니다.</p>
      </section>

      <section id="learning" class="content-section" aria-labelledby="learning-title">
        <p class="eyebrow">LEARNING</p>
        <h2 id="learning-title">Loop 엔지니어링 교육</h2>
        <div class="learning-card">
          <span>2026.07.30</span>
          <strong>오전 이론 · 오후 실습</strong>
        </div>
      </section>

      <section id="games" class="content-section games" aria-labelledby="games-title">
        <p class="eyebrow">GAMES</p>
        <h2 id="games-title">잠시 쉬어가세요.</h2>
        <p>게임 공간을 준비하고 있습니다. 지렁이 게임은 다음 루프에서 구현합니다.</p>
        <div class="game-placeholder" role="status">Coming soon</div>
      </section>
    </main>

    <footer class="site-footer">© 2026 교육생</footer>
  </body>
</html>
